name: Docs Generation Suggestions

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'app/**'
      - 'api/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-gen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  suggest-docs:
    name: Suggest Doc Updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml httpx

      - name: Check for provider configuration
        id: check-provider
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ] || [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "has_provider=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_provider=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate doc suggestions (dry-run)
        if: steps.check-provider.outputs.has_provider == 'true'
        env:
          DOCGEN_PROVIDER: ${{ secrets.DOCGEN_PROVIDER || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m scripts.docgen.cli \
            --provider "${DOCGEN_PROVIDER}" \
            --dry-run --verbose \
            > /tmp/docgen-suggestions.txt 2>&1 || true

      - name: Post PR comment with suggestions
        if: steps.check-provider.outputs.has_provider == 'true' && hashFiles('/tmp/docgen-suggestions.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const suggestionsPath = '/tmp/docgen-suggestions.txt';
            if (!fs.existsSync(suggestionsPath)) return;
            let suggestions = fs.readFileSync(suggestionsPath, 'utf8').trim();
            if (!suggestions) return;

            // Truncate to prevent extremely large comments (GitHub limit: 65536 chars)
            const MAX_LEN = 8000;
            if (suggestions.length > MAX_LEN) {
              suggestions = suggestions.slice(0, MAX_LEN) + '\n\n... (truncated)';
            }

            // Escape backtick sequences that could break the code block fence.
            // Any occurrence of ``` in the output is replaced with a zero-width
            // space between the backticks so the fence cannot be prematurely closed.
            suggestions = suggestions.replace(/```/g, '`\u200B`\u200B`');

            // Delete previous bot comment if exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Documentation Generation Suggestions')
            );
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Documentation Generation Suggestions\n\n\`\`\`\n${suggestions}\n\`\`\`\n\n---\n_Generated by docgen. Run \`make docs-gen\` locally to generate._`
            });
