name: Docs Version Freeze PR

# Disparado por push de tag semantica (ex: v1.2.0).
# Congela a documentacao atual, cria um branch de automacao
# e abre um PR para revisao humana antes do merge.
#
# Estrategia de congelamento:
#   Major e Minor -> sempre congela
#   Patch -> so congela se necessario (abra a tag manualmente nesse caso)
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  freeze-docs-version:
    name: Freeze Docs Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install Poetry
        run: pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --no-interaction --no-root

      - name: Install docs dependencies
        run: pnpm --dir docs-site install --frozen-lockfile

      - name: Export OpenAPI schema (versao final)
        run: poetry run python scripts/export_openapi.py

      - name: Generate latest API docs
        run: pnpm --dir docs-site docusaurus gen-api-docs all

      - name: Freeze docs version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_CLEAN="${VERSION#v}"
          pnpm --dir docs-site docusaurus docs:version "$VERSION_CLEAN"
          echo "VERSION_CLEAN=$VERSION_CLEAN" >> "$GITHUB_ENV"

      - name: Commit version freeze to automation branch
        run: |
          BRANCH="automation/docs-version-${VERSION_CLEAN}"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs-site/versioned_docs \
            docs-site/versioned_sidebars \
            docs-site/versions.json
          git commit -m "docs: freeze version ${VERSION_CLEAN}" || exit 0
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "docs: freeze version ${VERSION_CLEAN}" \
            --head "$BRANCH" \
            --base main \
            --body "$(cat <<'BODY'
          PR automatizado para congelar a fotografia documental da release **${VERSION_CLEAN}**.

          ## O que este PR faz

          - Congela \`docs-site/docs/\` na versao ${VERSION_CLEAN}
          - Cria \`docs-site/versioned_docs/version-${VERSION_CLEAN}/\`
          - Cria \`docs-site/versioned_sidebars/version-${VERSION_CLEAN}-sidebars.json\`
          - Atualiza \`docs-site/versions.json\`

          ## Como revisar

          1. Verifique se o conteudo da versao congelada esta correto
          2. Faca o merge para publicar a nova fotografia documental no portal

          > Gerado automaticamente pelo workflow \`docs-version-pr.yml\`
          BODY
          )"
