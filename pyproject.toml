[tool.poetry]
name = "docusaurus-reviewops"
version = "0.1.0"
description = "PR auto-approval agent + Docusaurus versioned portal — drop-in for any GitHub repo"
authors = []
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12"
pyyaml = "^6.0"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
ruff = "==0.15.11"  # keep in sync with .pre-commit-config.yaml rev: v0.9.10
pytest = "^8.3"
pytest-cov = "^6.0"
mypy = "^1.15"
pytest-mock = "^3.14"
types-pyyaml = "^6.0"

[tool.poetry.scripts]
export-openapi = "scripts.export_openapi:main"
docgen = "scripts.docgen.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["scripts", ".github/scripts"]
omit = ["*/test_*", "tests/*", "scripts/docgen/providers/mock.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
