[tool.poetry]
name = "docusaurus-reviewops"
version = "0.1.0"
description = "PR auto-approval agent + Docusaurus versioned portal — drop-in for any GitHub repo"
authors = []
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12"
pyyaml = "^6.0"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9"
pytest = "^8.3"
mypy = "^1.15"
pytest-mock = "^3.14"

[tool.poetry.scripts]
export-openapi = "scripts.export_openapi:main"
docgen = "scripts.docgen.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
